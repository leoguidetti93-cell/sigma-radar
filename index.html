<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGMA RADAR — Beta Lab 1.1 — ORION</title>
<style>
:root{
  --bg:#05070b;
  --panel:#0b1017;
  --panel2:#101824;
  --line:#1f2a38;
  --text:#f5f7fb;
  --muted:#7e8ca0;
  --cyan:#53d7ff;
  --green:#47f3a2;
  --yellow:#ffd862;
  --orange:#ff944a;
  --red:#ff4f6d;
  --violet:#9c7cff;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 0%,rgba(83,215,255,.10),transparent 25%),
    radial-gradient(circle at 85% 10%,rgba(156,124,255,.09),transparent 25%),
    linear-gradient(180deg,#05070b,#070b12 55%,#05070b);
  font-family:Inter,Segoe UI,Arial,sans-serif;
  overflow-x:hidden;
}
body:before{
  content:"";
  position:fixed;inset:0;pointer-events:none;opacity:.22;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:32px 32px;
}
button{font:inherit}
.screen{display:none;min-height:100vh;padding:28px}
.screen.active{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.shell{max-width:1420px;margin:auto}
.topline{
  display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px
}
.brand h1{margin:0;font-size:40px;letter-spacing:-1.8px}
.brand h1 span{color:var(--cyan)}
.brand p{margin:6px 0 0;color:var(--muted)}
.status-pill{
  padding:9px 13px;border-radius:999px;border:1px solid rgba(71,243,162,.26);
  color:var(--green);background:rgba(71,243,162,.07);font-size:12px;font-weight:800
}
.beta{
  margin-left:8px;color:var(--yellow);border-color:rgba(255,216,98,.25);
  background:rgba(255,216,98,.07)
}
.hero{
  min-height:260px;padding:34px;border-radius:28px;border:1px solid var(--line);
  background:
    linear-gradient(135deg,rgba(83,215,255,.10),transparent 34%),
    linear-gradient(145deg,rgba(16,24,36,.96),rgba(8,12,18,.96));
  display:flex;align-items:center;justify-content:space-between;gap:30px;
  box-shadow:0 28px 70px rgba(0,0,0,.35);position:relative;overflow:hidden
}
.hero:after{
  content:"";position:absolute;width:360px;height:360px;border-radius:50%;
  right:-120px;top:-170px;border:1px solid rgba(83,215,255,.16);
  box-shadow:0 0 80px rgba(83,215,255,.12)
}
.hero h2{font-size:clamp(32px,5vw,64px);line-height:.98;letter-spacing:-3px;margin:0 0 15px}
.hero p{max-width:680px;color:var(--muted);font-size:17px;line-height:1.6;margin:0}
.core{
  width:170px;height:170px;border-radius:50%;display:grid;place-items:center;
  border:1px solid rgba(83,215,255,.25);
  background:radial-gradient(circle,rgba(83,215,255,.28),rgba(83,215,255,.04) 58%,transparent 60%);
  box-shadow:0 0 55px rgba(83,215,255,.20),inset 0 0 35px rgba(83,215,255,.12);
  position:relative
}
.core:before,.core:after{
  content:"";position:absolute;border-radius:50%;border:1px dashed rgba(83,215,255,.25)
}
.core:before{inset:-16px;animation:spin 16s linear infinite}
.core:after{inset:15px;animation:spin 10s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.core b{font-size:22px;letter-spacing:2px}

.modules{
  display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px
}
.module{
  min-height:190px;padding:22px;text-align:left;border-radius:22px;border:1px solid var(--line);
  color:var(--text);cursor:pointer;position:relative;overflow:hidden;
  background:linear-gradient(145deg,rgba(16,24,36,.97),rgba(8,12,18,.97));
  transition:.25s
}
.module:hover{
  transform:translateY(-5px);border-color:rgba(83,215,255,.34);
  box-shadow:0 18px 45px rgba(0,0,0,.34),0 0 30px rgba(83,215,255,.07)
}
.module:after{
  content:"";position:absolute;inset:auto -40px -70px auto;width:150px;height:150px;
  border-radius:50%;background:var(--glow,rgba(83,215,255,.10));filter:blur(8px)
}
.icon{
  width:48px;height:48px;border-radius:15px;display:grid;place-items:center;
  background:rgba(83,215,255,.08);border:1px solid rgba(83,215,255,.16);
  font-size:22px;margin-bottom:22px
}
.module h3{margin:0 0 8px;font-size:20px}
.module p{margin:0;color:var(--muted);line-height:1.45;font-size:13px}
.module .tag{
  position:absolute;right:16px;top:16px;font-size:10px;font-weight:800;
  color:var(--green);padding:6px 8px;border-radius:999px;background:rgba(71,243,162,.07)
}
.module.disabled{opacity:.55;cursor:not-allowed}
.module.disabled:hover{transform:none;border-color:var(--line);box-shadow:none}
.module.disabled .tag{color:var(--yellow);background:rgba(255,216,98,.07)}

.lab{
  position:fixed;inset:0;z-index:50;display:none;place-items:center;
  background:rgba(3,5,8,.96);backdrop-filter:blur(12px)
}
.lab.show{display:grid}
.lab-box{text-align:center;width:min(620px,90vw)}
.lab-ring{
  width:190px;height:190px;margin:0 auto 28px;border-radius:50%;position:relative;
  border:1px solid rgba(83,215,255,.18);box-shadow:0 0 65px rgba(83,215,255,.14)
}
.lab-ring:before,.lab-ring:after{
  content:"";position:absolute;border-radius:50%;inset:15px;border:2px solid transparent;
  border-top-color:var(--cyan);border-right-color:rgba(83,215,255,.25);animation:spin 1.2s linear infinite
}
.lab-ring:after{inset:42px;border-top-color:var(--violet);animation-duration:.75s;animation-direction:reverse}
.lab-dot{
  position:absolute;inset:0;display:grid;place-items:center;font-weight:900;
  color:var(--cyan);letter-spacing:2px
}
.lab h2{font-size:28px;margin:0}
.lab p{color:var(--muted)}
.progress{height:5px;background:#131b26;border-radius:99px;overflow:hidden;margin-top:24px}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--green));animation:load 1.7s ease forwards}
@keyframes load{to{width:100%}}

.inner-header{
  display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px
}
.back{
  border:1px solid var(--line);background:#0d141e;color:var(--text);
  padding:11px 15px;border-radius:12px;cursor:pointer;font-weight:800
}
.back:hover{border-color:rgba(83,215,255,.35)}
.title-group h2{margin:0;font-size:31px}
.title-group p{margin:5px 0 0;color:var(--muted)}
.grid{display:grid;gap:18px}
.two{grid-template-columns:1.3fr .7fr}
.card{
  border:1px solid var(--line);border-radius:22px;padding:20px;
  background:linear-gradient(145deg,rgba(16,24,36,.97),rgba(8,12,18,.97));
  box-shadow:0 18px 45px rgba(0,0,0,.22)
}
.big-time{font-size:clamp(44px,8vw,84px);font-weight:950;letter-spacing:-5px;margin:20px 0 8px}
.level{display:inline-flex;padding:8px 11px;border-radius:999px;color:var(--green);background:rgba(71,243,162,.08);font-size:12px;font-weight:900}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.metric{padding:14px;border-radius:14px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05)}
.metric span{display:block;color:var(--muted);font-size:11px}
.metric b{display:block;margin-top:6px;font-size:19px}
.pulse{
  width:150px;height:150px;margin:20px auto;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle,rgba(71,243,162,.34),rgba(71,243,162,.04) 62%);
  box-shadow:0 0 55px rgba(71,243,162,.18);font-size:40px
}
.center{text-align:center}
.list{display:flex;flex-direction:column;gap:10px}
.row{
  display:grid;grid-template-columns:110px 1fr 80px 90px;gap:12px;align-items:center;
  padding:14px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.02)
}
.row strong{font-size:17px}
.bar{height:7px;border-radius:99px;background:#202b39;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:99px}
.score{text-align:right;font-size:24px;font-weight:950}
.small{font-size:11px;color:var(--muted)}

.heat-shell{overflow:auto;padding-bottom:8px}
.heat-grid{
  min-width:1080px;display:grid;grid-template-columns:58px repeat(20,1fr);gap:4px
}
.h-label,.m-label{font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.heat-cell{
  height:25px;border-radius:5px;position:relative;cursor:pointer;transition:.18s;
  border:1px solid rgba(255,255,255,.025)
}
.heat-cell:hover{transform:scale(1.15);z-index:2;border-color:white;box-shadow:0 0 20px currentColor}
.t1{background:#101a29;color:#101a29}.t2{background:#14345b;color:#14345b}
.t3{background:#1267a3;color:#1267a3}.t4{background:#25b5cf;color:#25b5cf}
.t5{background:#9bd24c;color:#9bd24c}.t6{background:#ffd84d;color:#ffd84d}
.t7{background:#ff9847;color:#ff9847}.t8{background:#ff4f5f;color:#ff4f5f}
.t9{background:#ff1f47;color:#ff1f47;box-shadow:0 0 12px rgba(255,31,71,.35)}
.legend{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:14px;color:var(--muted);font-size:11px}
.legend span{width:24px;height:8px;border-radius:99px}
.tooltip{
  position:fixed;z-index:30;display:none;padding:10px 12px;border-radius:11px;
  background:#05080d;border:1px solid var(--line);font-size:12px;box-shadow:0 12px 30px rgba(0,0,0,.4)
}
table{width:100%;border-collapse:collapse}
th,td{padding:13px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11px;color:var(--muted);text-transform:uppercase}
tr:hover td{background:rgba(83,215,255,.025)}
.rank{font-size:22px;font-weight:950;color:var(--cyan)}
.dev{
  min-height:420px;display:grid;place-items:center;text-align:center
}
.dev .orb{width:130px;height:130px;border-radius:50%;margin:auto;display:grid;place-items:center;
  border:1px dashed rgba(156,124,255,.45);box-shadow:0 0 45px rgba(156,124,255,.14);font-size:38px}

.live-time-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.live-time-field{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:16px;
  background:rgba(255,255,255,.025);
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.8px;
}
.live-time-field input{
  width:100%;
  border:1px solid rgba(83,215,255,.17);
  background:#080d14;
  color:var(--text);
  border-radius:12px;
  padding:13px;
  font-size:22px;
  font-weight:900;
  outline:none;
  color-scheme:dark;
}
.live-time-field input:focus{
  border-color:var(--cyan);
  box-shadow:0 0 0 3px rgba(83,215,255,.08);
}
.sim-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.secondary-action{background:rgba(255,255,255,.025)}
.sim-error{
  display:none;
  margin-top:14px;
  padding:12px;
  border-radius:12px;
  color:#ff9bab;
  background:rgba(255,79,109,.08);
  border:1px solid rgba(255,79,109,.22);
  font-size:13px;
}
.sim-error.show{display:block}
.interval-display{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:18px 0;
}
.interval-display span{
  min-height:72px;
  display:grid;
  place-items:center;
  border-radius:15px;
  font-size:22px;
  font-weight:950;
  color:var(--cyan);
  border:1px solid rgba(83,215,255,.18);
  background:radial-gradient(circle,rgba(83,215,255,.12),rgba(83,215,255,.025));
}
.sim-formula{display:flex;flex-direction:column;gap:10px}
.sim-formula div{
  display:flex;align-items:center;justify-content:space-between;gap:15px;
  padding:13px 14px;border-radius:13px;
  background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.045)
}
.sim-formula span{color:var(--muted);font-size:12px}
.sim-formula strong{font-size:17px}
.simulation-results{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-top:16px;
}
.projection-card{
  min-height:190px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  border:1px solid var(--line);
  border-radius:20px;
  background:
    radial-gradient(circle at 50% 10%,rgba(83,215,255,.11),transparent 45%),
    rgba(255,255,255,.02);
  position:relative;
  overflow:hidden;
}
.projection-card:before{
  content:"";position:absolute;inset:auto 18% 0;height:2px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent)
}
.sigma-projection{
  border-color:rgba(71,243,162,.28);
  background:
    radial-gradient(circle at 50% 10%,rgba(71,243,162,.16),transparent 48%),
    rgba(255,255,255,.02);
  box-shadow:0 0 35px rgba(71,243,162,.07)
}
.sigma-projection:before{background:linear-gradient(90deg,transparent,var(--green),transparent)}
.projection-label{font-size:10px;color:var(--muted);font-weight:900;letter-spacing:1px}
.projection-time{font-size:50px;letter-spacing:-2px;margin:14px 0 8px}
.projection-offset{font-size:12px;color:var(--green)}
.sim-note{
  margin-top:15px;
  color:var(--muted);
  line-height:1.5;
  font-size:12px;
  text-align:center
}
@media(max-width:700px){
  .live-time-grid{grid-template-columns:1fr 1fr}
  .simulation-results{grid-template-columns:1fr}
  .projection-card{min-height:150px}
  .interval-display{grid-template-columns:1fr}
}


.hour-btn,.period-btn{
  border:1px solid var(--line);background:#0d141e;color:var(--muted);
  padding:12px 8px;border-radius:12px;cursor:pointer;font-weight:850;
  transition:.2s
}
.hour-btn:hover,.period-btn:hover{border-color:rgba(83,215,255,.35);color:var(--text)}
.hour-btn.active,.period-btn.active{
  color:#041019;background:linear-gradient(135deg,var(--cyan),var(--green));
  border-color:transparent;box-shadow:0 0 22px rgba(83,215,255,.18)
}

/* SIGMA COLOR IA */
.color-toolbar{display:flex;gap:12px;align-items:end;justify-content:space-between;flex-wrap:wrap}
.color-hour-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;margin-top:14px}
.action-btn{
  border:1px solid rgba(83,215,255,.28);background:linear-gradient(135deg,rgba(83,215,255,.16),rgba(156,124,255,.11));
  color:var(--text);padding:12px 16px;border-radius:12px;cursor:pointer;font-weight:900;transition:.2s
}
.action-btn:hover{transform:translateY(-2px);border-color:rgba(83,215,255,.55);box-shadow:0 10px 28px rgba(83,215,255,.12)}
.color-signal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.signal-card{
  position:relative;overflow:hidden;border:1px solid var(--line);border-radius:17px;padding:16px;
  background:linear-gradient(145deg,rgba(16,24,36,.98),rgba(8,12,18,.98));min-height:145px
}
.signal-card:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-35px;bottom:-42px;filter:blur(2px);opacity:.28}
.signal-card.red:after{background:var(--red)} .signal-card.black:after{background:#607086}
.signal-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.signal-time{font-size:22px;font-weight:950;letter-spacing:-1px}
.color-ball{width:28px;height:28px;border-radius:50%;box-shadow:0 0 18px currentColor;border:2px solid rgba(255,255,255,.42)}
.color-ball.red{background:#ef334f;color:#ef334f}.color-ball.black{background:#1b2430;color:#65768c}
.signal-name{margin-top:12px;font-weight:900}
.signal-meta{display:flex;justify-content:space-between;margin-top:13px;color:var(--muted);font-size:11px}
.signal-score{color:var(--cyan);font-size:20px;font-weight:950}
.color-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}

/* RANKING DE PADRÕES */
.pattern-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.pattern-row{
  display:grid;grid-template-columns:54px minmax(180px,1.1fr) minmax(160px,1fr) 92px 92px 80px;
  gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:16px;
  background:rgba(255,255,255,.022);transition:.2s;cursor:pointer
}
.pattern-row:hover{border-color:rgba(156,124,255,.38);transform:translateX(3px);background:rgba(156,124,255,.035)}
.pattern-pos{font-size:22px;font-weight:950;color:var(--violet)}
.pattern-seq{display:flex;gap:6px;align-items:center}
.pattern-dot{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:950;border:1px solid rgba(255,255,255,.18)}
.pattern-dot.V{background:#d93650}.pattern-dot.P{background:#18202b}
.pattern-signal{font-weight:900}.pattern-signal.V{color:#ff647b}.pattern-signal.P{color:#aebbc9}
.pattern-detail{
  display:none;margin-top:16px;padding:17px;border-radius:16px;border:1px solid rgba(156,124,255,.22);
  background:linear-gradient(135deg,rgba(156,124,255,.08),rgba(83,215,255,.035))
}
.pattern-detail.show{display:block;animation:fade .25s ease}
.pattern-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}

@media(max-width:980px){
  .color-signal-grid{grid-template-columns:repeat(3,1fr)}
  .pattern-row{grid-template-columns:48px 1fr 1fr 70px}
  .pattern-row .pattern-hide{display:none}
}
@media(max-width:700px){
  .color-hour-grid{grid-template-columns:repeat(6,1fr)}
  .color-signal-grid{grid-template-columns:repeat(2,1fr)}
  .color-summary,.pattern-kpis{grid-template-columns:repeat(2,1fr)}
  .pattern-row{grid-template-columns:42px 1fr 74px}
  .pattern-row .pattern-mobile-hide{display:none}
}

@media(max-width:760px){
  #hourSelector{grid-template-columns:repeat(6,1fr)!important}
  #periodSelector{grid-template-columns:repeat(2,1fr)!important}
}

@media(max-width:980px){
  .modules{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
}
@media(max-width:650px){
  .screen{padding:16px}
  .hero{padding:24px;display:block}
  .core{width:120px;height:120px;margin-top:26px}
  .modules{grid-template-columns:1fr}
  .metrics{grid-template-columns:1fr}
  .row{grid-template-columns:88px 1fr 55px}
  .row .optional{display:none}
}

/* ===== ORION UI — PLAYER EXPERIENCE ===== */
:root{
  --bg:#071018;
  --panel:#101923;
  --panel2:#141f2b;
  --line:#263442;
  --text:#f5f7fa;
  --muted:#8493a5;
  --cyan:#45c7e8;
  --green:#34d399;
  --yellow:#f4c95d;
  --orange:#ff9147;
  --red:#f12c4c;
  --red2:#bf1733;
  --violet:#7c6cf3;
}
body{
  background:
    radial-gradient(circle at 76% 0%,rgba(241,44,76,.08),transparent 28%),
    linear-gradient(180deg,#071018,#08111a 42%,#060c12);
}
body:before{opacity:.09;background-size:46px 46px}
.player-sidebar{
  position:fixed;left:0;top:0;bottom:0;width:238px;z-index:45;
  display:flex;flex-direction:column;
  padding:22px 15px 18px;
  background:linear-gradient(180deg,#101a25,#0a121b);
  border-right:1px solid #24313e;
  box-shadow:14px 0 42px rgba(0,0,0,.22)
}
.side-logo{padding:7px 10px 22px}
.side-logo strong{display:block;font-size:27px;letter-spacing:-1.4px}
.side-logo strong em{font-style:normal;color:var(--red)}
.side-logo span{display:block;margin-top:5px;color:var(--muted);font-size:11px;letter-spacing:.8px}
.side-status{
  display:flex;align-items:center;gap:8px;margin:0 8px 18px;
  padding:10px 11px;border-radius:11px;background:#121e29;border:1px solid #293744;
  color:#a9b5c1;font-size:11px;font-weight:800
}
.side-status i{
  width:8px;height:8px;border-radius:50%;background:var(--green);
  box-shadow:0 0 10px rgba(52,211,153,.72)
}
.side-nav{display:flex;flex-direction:column;gap:4px}
.side-link{
  width:100%;border:0;background:transparent;color:#9aa7b4;
  display:flex;align-items:center;gap:12px;padding:11px 12px;
  border-radius:10px;cursor:pointer;text-align:left;font-weight:760;font-size:13px;
  transition:.18s
}

/* ===== CATALOGADOR ===== */
function startLiveCatalog(){}

/* ===== SIMULADOR DE SESSÃO — 300 RODADAS TIPMINER ===== */
let currentSessionSignals=[];

function normalizeHeader(value){
  return String(value??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
}
function rowValue(row,names){
  for(const [key,value] of Object.entries(row)){
    if(names.includes(normalizeHeader(key)) && value!==null && value!=='')return value;
  }
  return null;
}
function parseTipDate(dateValue,timeValue){
  let date;
  if(dateValue instanceof Date)date=new Date(dateValue);
  else{
    const match=String(dateValue??'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(!match)return null;
    date=new Date(Number(match[3]),Number(match[2])-1,Number(match[1]));
  }
  if(timeValue instanceof Date)date.setHours(timeValue.getHours(),timeValue.getMinutes(),timeValue.getSeconds());
  else{
    const time=String(timeValue??'').match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
    if(!time)return null;
    date.setHours(Number(time[1]),Number(time[2]),Number(time[3]||0));
  }
  return date;
}
function parseTipRows(rows){
  return rows.map(row=>{
    const number=Number(rowValue(row,['numero','number','roll','resultado','result']));
    const date=parseTipDate(rowValue(row,['data','date']),rowValue(row,['horario','hora','time']));
    return Number.isFinite(number)&&number>=0&&number<=14&&date ? {number,date} : null;
  }).filter(Boolean);
}
function medianSession(values){
  const sorted=[...values].sort((a,b)=>a-b),middle=Math.floor(sorted.length/2);
  return sorted.length%2?sorted[middle]:(sorted[middle-1]+sorted[middle])/2;
}
function weightedSession(values){
  let total=0,weights=0;
  values.forEach((value,index)=>{const weight=index+1;total+=value*weight;weights+=weight});
  return total/weights;
}
function sessionTime(date){return date.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function sessionPeriod(start,end){return `${start.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})} ${sessionTime(start)} → ${sessionTime(end)}`}
function sessionError(message){
  const el=document.getElementById('sessionSimulatorError');
  el.textContent=message||'';
  el.classList.toggle('show',Boolean(message));
}
function sessionStatus(text,success=false){
  const el=document.getElementById('sessionSimulatorStatus');
  el.textContent=text;
  el.classList.toggle('beta',!success);
}
function buildSignals(lastWhite,mean,median,weighted){
  const methods=[['Média',Math.round(mean)],['Mediana',Math.round(median)],['Ponderada',Math.round(weighted)]];
  const candidates=[];
  methods.forEach(([name,interval])=>{
    for(let step=1;step<=6;step++)candidates.push({name,time:lastWhite.getTime()+interval*step*60000});
  });
  candidates.sort((a,b)=>a.time-b.time);
  const clusters=[];
  candidates.forEach(candidate=>{
    const last=clusters[clusters.length-1];
    if(last&&Math.abs(candidate.time-last.average)<=120000){
      last.items.push(candidate);
      last.average=last.items.reduce((sum,item)=>sum+item.time,0)/last.items.length;
    }else clusters.push({average:candidate.time,items:[candidate]});
  });
  return clusters.map(cluster=>({
    time:new Date(Math.round(cluster.average/60000)*60000),
    methods:[...new Set(cluster.items.map(item=>item.name))]
  })).slice(0,6);
}
function renderSession(rounds){
  const unique=new Map();
  rounds.sort((a,b)=>a.date-b.date).forEach(round=>unique.set(`${round.date.toISOString()}-${round.number}`,round));
  const latest=[...unique.values()].slice(-300);

  if(latest.length<300)throw new Error(`Foram encontradas apenas ${latest.length} rodadas válidas. A planilha precisa conter pelo menos 300.`);

  const whites=latest.filter(round=>round.number===0);
  if(whites.length<4)throw new Error(`A amostra contém apenas ${whites.length} brancos.`);

  const intervals=[];
  for(let i=1;i<whites.length;i++){
    const difference=(whites[i].date-whites[i-1].date)/60000;
    if(difference>0&&difference<180)intervals.push(difference);
  }

  const recent=intervals.slice(-10);
  if(recent.length<3)throw new Error('Não foi possível calcular intervalos suficientes.');

  const mean=recent.reduce((sum,value)=>sum+value,0)/recent.length;
  const median=medianSession(recent);
  const weighted=weightedSession(recent);
  const cycle=(mean+median+weighted)/3;
  const lastWhite=whites[whites.length-1].date;

  currentSessionSignals=buildSignals(lastWhite,mean,median,weighted);

  document.getElementById('sessionRoundsUsed').textContent=latest.length;
  document.getElementById('sessionWhitesFound').textContent=whites.length;
  document.getElementById('sessionLastWhite').textContent=sessionTime(lastWhite);
  document.getElementById('sessionPeriod').textContent=sessionPeriod(latest[0].date,latest[latest.length-1].date);
  document.getElementById('sessionMean').textContent=`${mean.toFixed(1).replace('.',',')} min`;
  document.getElementById('sessionMedian').textContent=`${median.toFixed(1).replace('.',',')} min`;
  document.getElementById('sessionWeighted').textContent=`${weighted.toFixed(1).replace('.',',')} min`;
  document.getElementById('sessionCycle').textContent=`${cycle.toFixed(1).replace('.',',')} min`;
  document.getElementById('sessionIntervals').innerHTML=recent.map(value=>`<span>${value.toFixed(1).replace('.',',')}</span>`).join('');
  document.getElementById('sessionSignals').innerHTML=currentSessionSignals.map(signal=>`
    <div class="session-signal ${signal.methods.length>=2?'high':''}">
      <strong>${sessionTime(signal.time)}</strong>
      <span>${signal.methods.length}/3 métodos</span>
    </div>
  `).join('');

  document.getElementById('sessionSimulatorContent').classList.remove('is-hidden');
  sessionStatus('ANÁLISE CONCLUÍDA',true);
}
async function handleSessionSpreadsheet(event){
  const file=event.target.files?.[0];
  if(!file)return;

  sessionError('');
  sessionStatus('LENDO PLANILHA');
  document.getElementById('sessionSimulatorContent').classList.add('is-hidden');

  try{
    if(typeof XLSX==='undefined')throw new Error('O leitor de planilhas não carregou. Atualize a página.');

    const buffer=await file.arrayBuffer();
    const workbook=XLSX.read(buffer,{type:'array',cellDates:true});
    let rows=[];

    workbook.SheetNames.forEach(name=>{
      rows.push(...XLSX.utils.sheet_to_json(workbook.Sheets[name],{defval:null,raw:true}));
    });

    const parsed=parseTipRows(rows);
    if(!parsed.length)throw new Error('Não reconheci as colunas Número, Data e Horário.');

    renderSession(parsed);
  }catch(error){
    console.error(error);
    sessionStatus('ERRO NA IMPORTAÇÃO');
    sessionError(error.message);
  }finally{
    event.target.value='';
  }
}
function copySessionSignals(){
  if(!currentSessionSignals.length)return;
  navigator.clipboard.writeText(currentSessionSignals.map(signal=>sessionTime(signal.time)).join('\n')).then(()=>{
    const button=document.getElementById('copySessionSignalsBtn');
    const original=button.textContent;
    button.textContent='✓ Sinais copiados';
    setTimeout(()=>button.textContent=original,1600);
  });
}

/* ===== RANKING DE PADRÕES IA ===== */
function patternDots(raw){
  return raw.split('').map(x=>`<span class="pattern-dot ${x}">${x}</span>`).join('');
}
function renderPatterns(){
  const list=document.getElementById('patternList');
  const items=sigmaBase.patterns||[];
  list.innerHTML=items.map((p,i)=>`
    <div class="pattern-row" onclick="showPatternDetail(${i})">
      <div class="pattern-pos">${String(i+1).padStart(2,'0')}</div>
      <div class="pattern-seq">${patternDots(p.raw)}</div>
      <div class="pattern-signal ${p.signal}">${p.signalName}<div class="small">Entrada + cobertura até G1</div></div>
      <div class="pattern-mobile-hide"><div class="small">Ocorrências</div><strong>${p.occurrences.toLocaleString('pt-BR')}</strong></div>
      <div class="pattern-hide"><div class="small">Até G1</div><strong>${String(p.g1).replace('.',',')}%</strong></div>
      <div class="score">${p.score}</div>
    </div>`).join('');
  document.getElementById('patternBaseInfo').textContent=`${(sigmaBase.meta.records||0).toLocaleString('pt-BR')} rodadas processadas`;
  if(items.length)showPatternDetail(0);
}
function showPatternDetail(index){
  const p=(sigmaBase.patterns||[])[index];if(!p)return;
  const detail=document.getElementById('patternDetail');
  detail.classList.add('show');
  detail.innerHTML=`
    <div class="small">DETALHES DO PADRÃO #${String(index+1).padStart(2,'0')}</div>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:10px">
      <div class="pattern-seq">${patternDots(p.raw)}</div>
      <div style="font-size:22px;color:var(--muted)">→</div>
      <div class="pattern-signal ${p.signal}" style="font-size:21px">${p.signalName} até G1</div>
    </div>
    <div class="pattern-kpis">
      <div class="metric"><span>Score Sigma</span><b>${p.score}</b></div>
      <div class="metric"><span>Ocorrências</span><b>${p.occurrences.toLocaleString('pt-BR')}</b></div>
      <div class="metric"><span>Acerto direto</span><b>${String(p.direct).replace('.',',')}%</b></div>
      <div class="metric"><span>Acumulado G1</span><b>${String(p.g1).replace('.',',')}%</b></div>
      <div class="metric"><span>Loss após G1</span><b>${String(p.loss).replace('.',',')}%</b></div>
    </div>`;
}

function initializeHistoricalModules(){
  const hasColors = sigmaBase && sigmaBase.colorByHour &&
    Object.keys(sigmaBase.colorByHour).length === 24;
  const hasPatterns = sigmaBase && Array.isArray(sigmaBase.patterns) &&
    sigmaBase.patterns.length >= 10;

  const colorStatus = document.getElementById('colorDataStatus');
  const patternStatus = document.getElementById('patternDataStatus');

  if(colorStatus){
    colorStatus.textContent = hasColors ? 'BASE 1.2 • CARREGADA' : 'BASE 1.2 • FALHA';
    if(!hasColors) colorStatus.classList.add('beta');
  }
  if(patternStatus){
    patternStatus.textContent = hasPatterns ? 'TOP 10 • BASE CARREGADA' : 'PADRÕES • FALHA';
    if(!hasPatterns) patternStatus.classList.add('beta');
  }

  renderColorHourSelector();

  if(hasColors){
    const defaultButton = document.querySelectorAll('#colorHourSelector .hour-btn')[14];
    selectColorHour(14, defaultButton);
  }else{
    document.getElementById('colorSignalGrid').innerHTML =
      '<div class="small">A Base Histórica não foi carregada. Atualize a página.</div>';
  }

  if(hasPatterns){
    renderPatterns();
  }else{
    document.getElementById('patternList').innerHTML =
      '<div class="small">O ranking histórico não pôde ser carregado.</div>';
  }
}
initializeHistoricalModules();

for(let h=0;h<24;h++){
  heat.innerHTML+=`<div class="h-label">${String(h).padStart(2,'0')}h</div>`;

const tip=document.getElementById('tooltip');
document.querySelectorAll('.heat-cell').forEach(el=>{
  el.addEventListener('mousemove',e=>{
    tip.style.display='block';
    tip.style.left=(e.clientX+14)+'px';
    tip.style.top=(e.clientY+14)+'px';
    tip.innerHTML=`<strong>${el.dataset.time}</strong><br>Intensidade ${el.dataset.score}/100`;
