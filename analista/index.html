<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIGMA RADAR — Painel do Analista</title>
<style>
:root{--bg:#071018;--panel:#111c26;--panel2:#0c151e;--line:#293946;--text:#f5f7fa;--muted:#8292a2;--red:#f12c4c;--red2:#bf1733;--green:#34d399;--yellow:#f4c95d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 75% 0%,rgba(241,44,76,.09),transparent 30%),linear-gradient(180deg,#071018,#050b11);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
button,input,textarea,select{font:inherit}
.wrap{width:min(1080px,calc(100% - 28px));margin:0 auto;padding:28px 0 50px}
.brand{display:flex;align-items:center;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid #22313d}
.logo{font-size:25px;font-weight:950;letter-spacing:-1px}.logo span{color:var(--red)}
.brand small{color:var(--muted);font-size:10px}
.card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#15212c,#0d161f);padding:20px}
.login{max-width:430px;margin:12vh auto 0}
h1,h2,h3{margin:0}.login p,.sub{color:var(--muted);font-size:12px;line-height:1.5}
.field{display:flex;flex-direction:column;gap:7px;margin-top:15px}
.field span{font-size:9px;color:#8796a5;font-weight:850;letter-spacing:.65px;text-transform:uppercase}
input,textarea,select{width:100%;border:1px solid #30404d;background:#08121a;color:white;border-radius:10px;padding:13px;outline:0}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(241,44,76,.08)}
.btn{border:0;border-radius:10px;padding:12px 15px;cursor:pointer;font-weight:900;color:white;background:linear-gradient(135deg,var(--red),var(--red2))}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-secondary{background:#1a2834;border:1px solid #344451}.btn-win{background:#159764}.btn-loss{background:#be2943}.btn-delete{background:#283642}
.login .btn{width:100%;margin-top:17px}
.error{display:none;margin-top:12px;color:#ff8da0;font-size:11px}.error.show{display:block}
.panel{display:none}.panel.show{display:block}
.panel-head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:24px 0 15px}
.grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:15px}
.counter{padding:10px 12px;border-radius:10px;background:#0a141d;border:1px solid #283844;color:#8e9daa;font-size:11px}
.active-list{display:flex;flex-direction:column;gap:10px}
.signal{padding:15px;border:1px solid #2b3b48;border-radius:13px;background:#0b151e}
.signal-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.signal-time{font-size:28px;font-weight:950}.status{font-size:8px;font-weight:950;color:#f5d273;background:rgba(244,201,93,.09);padding:6px 8px;border-radius:999px}
.window{color:#8594a2;font-size:10px;margin-top:5px}.note{color:#a2aeba;font-size:11px;margin-top:9px}
.result-row{display:grid;grid-template-columns:1fr auto auto auto;gap:7px;margin-top:12px}
.result-row select{padding:10px}
.empty{text-align:center;padding:28px;color:#748594;border:1px dashed #2d3c48;border-radius:12px}
.toast{position:fixed;right:18px;bottom:18px;padding:13px 16px;border-radius:11px;background:#14212b;border:1px solid #334450;opacity:0;transform:translateY(15px);pointer-events:none;transition:.2s;font-size:11px}.toast.show{opacity:1;transform:none}.toast.ok{color:#58e3ab}.toast.bad{color:#ff8296}
@media(max-width:780px){.grid{grid-template-columns:1fr}.result-row{grid-template-columns:1fr 1fr}.result-row select{grid-column:1/-1}.brand small{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <div class="logo">SIGMA <span>RADAR</span></div>
    <small>PAINEL PRIVADO DO ANALISTA</small>
  </header>

  <section id="loginCard" class="card login">
    <h2>Acesso do Analista</h2>
    <p>Digite a senha administrativa configurada na Vercel.</p>
    <label class="field"><span>Senha</span><input id="password" type="password" autocomplete="current-password"></label>
    <button class="btn" onclick="login()">Entrar</button>
    <div id="loginError" class="error">Senha inválida.</div>
  </section>

  <main id="panel" class="panel">
    <div class="panel-head">
      <div><h1>Central do Analista</h1><p class="sub">Publique até três sinais ativos com janela automática de ±1 minuto.</p></div>
      <button class="btn btn-secondary" onclick="logout()">Sair</button>
    </div>

    <div class="grid">
      <section class="card">
        <h3>Novo sinal</h3>
        <label class="field"><span>Data da operação</span><input id="signalDate" type="date"></label>
        <label class="field"><span>Horário central</span><input id="signalTime" type="time"></label>
        <label class="field"><span>Confiança</span>
          <select id="signalConfidence">
            <option value="5">★★★★★ Muito alta</option>
            <option value="4">★★★★☆ Alta</option>
            <option value="3">★★★☆☆ Moderada</option>
          </select>
        </label>
        <label class="field"><span>Observação</span><textarea id="signalNote" maxlength="180" placeholder="Ex.: Janela muito forte."></textarea></label>
        <button id="publishBtn" class="btn" style="width:100%;margin-top:16px" onclick="publishSignal()">Publicar sinal</button>
      </section>

      <section class="card">
        <div class="signal-top"><h3>Sinais ativos</h3><span id="activeCounter" class="counter">0 de 3</span></div>
        <div id="activeList" class="active-list" style="margin-top:15px"><div class="empty">Carregando...</div></div>
      </section>
    </div>
  </main>
</div>
<div id="toast" class="toast"></div>

<script>
let analystToken=sessionStorage.getItem('sigmaAnalystToken')||'';

function pad(v){return String(v).padStart(2,'0')}
function shiftMinute(time,delta){const [h,m]=time.split(':').map(Number);const d=new Date(2000,0,1,h,m+delta);return `${pad(d.getHours())}:${pad(d.getMinutes())}`}
function escapeHtml(text){return String(text??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function todayBrazil(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo'}).format(new Date())}
function showToast(message,type='ok'){const el=document.getElementById('toast');el.textContent=message;el.className=`toast ${type} show`;setTimeout(()=>el.className='toast',2200)}
function authHeaders(){return {'Content-Type':'application/json','Authorization':`Bearer ${analystToken}`}}

async function login(){
  const password=document.getElementById('password').value;
  const response=await fetch('/api/analista-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});
  if(!response.ok){document.getElementById('loginError').classList.add('show');return}
  const data=await response.json();
  analystToken=data.token;
  sessionStorage.setItem('sigmaAnalystToken',analystToken);
  openPanel();
}
function logout(){sessionStorage.removeItem('sigmaAnalystToken');analystToken='';location.reload()}
function openPanel(){
  document.getElementById('loginCard').style.display='none';
  document.getElementById('panel').classList.add('show');
  document.getElementById('signalDate').value=todayBrazil();
  loadActive();
}
async function verifySession(){
  if(!analystToken)return;
  const response=await fetch('/api/analista-sinais',{headers:authHeaders()});
  if(response.ok)openPanel();
  else logout();
}
async function loadActive(){
  const response=await fetch('/api/analista-sinais',{headers:authHeaders(),cache:'no-store'});
  if(response.status===401)return logout();
  const data=await response.json();
  const list=data.active||[];
  document.getElementById('activeCounter').textContent=`${list.length} de 3`;
  document.getElementById('publishBtn').disabled=list.length>=3;
  document.getElementById('activeList').innerHTML=list.length?list.map(signal=>{
    const meta=signal.meta||{};
    return `<article class="signal">
      <div class="signal-top"><strong class="signal-time">${escapeHtml(signal.horario)}</strong><span class="status">ATIVO</span></div>
      <div class="window">${shiftMinute(signal.horario,-1)} • ${escapeHtml(signal.horario)} • ${shiftMinute(signal.horario,1)}</div>
      <div class="note">${escapeHtml(meta.texto||'Sem observação')} · ${'★'.repeat(meta.confianca||5)}</div>
      <div class="result-row">
        <select id="resultMinute-${signal.id}">
          <option value="${shiftMinute(signal.horario,-1)}">Branco em ${shiftMinute(signal.horario,-1)}</option>
          <option value="${signal.horario}" selected>Branco em ${signal.horario}</option>
          <option value="${shiftMinute(signal.horario,1)}">Branco em ${shiftMinute(signal.horario,1)}</option>
        </select>
        <button class="btn btn-win" onclick="finishSignal(${signal.id},'pago')">PAGO</button>
        <button class="btn btn-loss" onclick="finishSignal(${signal.id},'falhou')">FALHOU</button>
        <button class="btn btn-delete" onclick="deleteSignal(${signal.id})">Excluir</button>
      </div>
    </article>`;
  }).join(''):'<div class="empty">Nenhum sinal ativo.</div>';
}
async function publishSignal(){
  const payload={
    data_operacao:document.getElementById('signalDate').value,
    horario:document.getElementById('signalTime').value,
    observacao:document.getElementById('signalNote').value.trim(),
    confianca:Number(document.getElementById('signalConfidence').value)
  };
  if(!payload.data_operacao||!payload.horario)return showToast('Informe data e horário.','bad');
  const response=await fetch('/api/analista-sinais',{method:'POST',headers:authHeaders(),body:JSON.stringify(payload)});
  const data=await response.json();
  if(!response.ok)return showToast(data.error||'Não foi possível publicar.','bad');
  document.getElementById('signalNote').value='';
  showToast('Sinal publicado.');
  loadActive();
}
async function finishSignal(id,status){
  const minuto=status==='pago'?document.getElementById(`resultMinute-${id}`).value:null;
  const response=await fetch('/api/analista-sinais',{method:'PATCH',headers:authHeaders(),body:JSON.stringify({id,status,minuto_resultado:minuto})});
  const data=await response.json();
  if(!response.ok)return showToast(data.error||'Erro ao encerrar.','bad');
  showToast(status==='pago'?'Sinal marcado como PAGO.':'Sinal marcado como FALHOU.');
  loadActive();
}
async function deleteSignal(id){
  if(!confirm('Excluir este sinal definitivamente?'))return;
  const response=await fetch(`/api/analista-sinais?id=${id}`,{method:'DELETE',headers:authHeaders()});
  if(!response.ok)return showToast('Erro ao excluir.','bad');
  showToast('Sinal excluído.');
  loadActive();
}
verifySession();
setInterval(()=>{if(analystToken)loadActive()},5000);
</script>
</body>
</html>
